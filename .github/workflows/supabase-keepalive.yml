name: Supabase keepalive

# O plano gratuito do Supabase PAUSA o projeto depois de 7 dias sem uso
# (README, "Hospedagem e publicação"). Na beta, uma semana sem ninguém logar é
# possível — e aí o site, o app desktop e o app do cuidador param juntos até
# alguém entrar no painel e reativar o projeto.
#
# Este workflow faz uma leitura barata na API REST a cada 3 dias (uma linha
# de `beta_program`, tabela que o site já lê anonimamente). Custo: segundos de
# runner e uma consulta.
#
# DE ONDE VÊM A URL E A CHAVE: da configuração pública versionada do site,
# site/.env.production (VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY — a mesma
# que o Cloudflare Pages usa; a chave anon é pública, está no bundle do site).
# Nenhum segredo precisa ser cadastrado. Se existirem os segredos SUPABASE_URL
# e SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions), eles têm
# prioridade. Sem nenhum dos dois o workflow FALHA (vermelho), de propósito:
# terminar verde sem ter consultado nada daria a impressão de que o projeto
# está protegido da pausa. O passo recebe só esses dois segredos, pelo nome —
# nunca o contexto inteiro serializado (toJSON de secrets), que o GitHub trata
# como possível exfiltração e segura, inclusive na execução agendada, até
# alguém aprovar à mão. A extensão do VS Code acusa "Context access might be
# invalid" enquanto eles não existirem; é só aviso do editor.
#
# ATENÇÃO: em repositório PÚBLICO, o GitHub desativa sozinho os workflows
# agendados depois de 60 dias sem nenhuma atividade no repositório (e avisa
# por e-mail). Aí o keepalive para de rodar e o Supabase volta a pausar após 7
# dias. Se a beta ficar parada tanto tempo, reative em Actions → Supabase
# keepalive → Enable workflow (ou faça qualquer commit).

on:
  schedule:
    # 09:17 UTC a cada 3 dias (minuto "quebrado": no minuto 0 a fila do GitHub
    # atrasa agendamentos).
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Consulta leve no Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Só o arquivo da configuração pública do site (sparse checkout).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site/.env.production
          sparse-checkout-cone-mode: false

      - name: Ler uma linha de beta_program
        env:
          SEGREDO_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SEGREDO_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          url="${SEGREDO_SUPABASE_URL:-}"
          chave="${SEGREDO_SUPABASE_ANON_KEY:-}"
          unset SEGREDO_SUPABASE_URL SEGREDO_SUPABASE_ANON_KEY
          publica=site/.env.production
          if [ -z "$url" ] && [ -f "$publica" ]; then
            url="$(sed -n 's/^VITE_SUPABASE_URL=//p' "$publica" | tr -d '\r"' | head -n1)"
          fi
          if [ -z "$chave" ] && [ -f "$publica" ]; then
            chave="$(sed -n 's/^VITE_SUPABASE_ANON_KEY=//p' "$publica" | tr -d '\r"' | head -n1)"
          fi
          if [ -z "$url" ] || [ -z "$chave" ]; then
            echo "::error::Sem URL e/ou chave anon do Supabase: nem em site/.env.production (VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY) nem nos segredos SUPABASE_URL/SUPABASE_ANON_KEY. Sem elas o keepalive não consulta nada e o Supabase gratuito pausa após 7 dias sem uso (README, 'Hospedagem e publicação')."
            exit 1
          fi
          echo "::add-mask::$chave"
          url="${url%/}"
          codigo="$(curl -sS -o resposta.json -w '%{http_code}' --max-time 30 \
            -H "apikey: $chave" -H "Authorization: Bearer $chave" \
            "$url/rest/v1/beta_program?select=*&limit=1")" || codigo="000"
          echo "HTTP $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::Supabase respondeu $codigo. Se for 5xx/000, o projeto pode já estar pausado: Dashboard → Restore project."
            head -c 300 resposta.json 2>/dev/null || true
            exit 1
          fi
          echo "ok — projeto ativo"
